[project]
name = "keepfold"
version = "0.7.0"
description = "One memory for all your AI apps, kept as plain Markdown files on your own computer."
dynamic = ["readme"]  # README.md with absolute links (tool.hatch.metadata.hooks.fancy-pypi-readme)
requires-python = ">=3.14"
license = "MIT"
keywords = ["mcp", "mcp-server", "memory", "second-brain", "local-first", "markdown", "obsidian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "mcp==2.3.0",
    "fsrs>=6.3,<7",
    "ruamel.yaml",
    "python-ulid",
    "typer",
    "fastembed>=0.9.1",
    "numpy",
    "truststore>=0.10.5",
    "pywebview>=6.2,<7 ; sys_platform == 'win32'",
    "pystray>=0.19.5,<0.20 ; sys_platform == 'win32'",
    "winrt-windows-security-credentials-ui>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    # C2: Windows' own offline OCR reads scanned PDFs (more_sources._ocr)
    "winrt-windows-media-ocr>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=4!10.0.28000.2957 ; sys_platform == 'win32'",
    "pypdf>=6.9.2,<7",
    "zstandard>=0.23 ; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/alenissacsam-2/keepfold"
Repository = "https://github.com/alenissacsam-2/keepfold"
Documentation = "https://github.com/alenissacsam-2/keepfold/blob/main/docs/GUIDE.md"
Issues = "https://github.com/alenissacsam-2/keepfold/issues"
Changelog = "https://github.com/alenissacsam-2/keepfold/releases"

[project.optional-dependencies]
# voice memos: local transcription, installed only by `keepfold model download --voice`
voice = ["faster-whisper==1.2.1"]

[project.scripts]
keepfold = "keepfold.taint:main"

[project.gui-scripts]
keepfold-app = "keepfold.app.launch:main"
keepfold-receiver = "keepfold.app.launch:receiver"

[dependency-groups]
dev = ["pytest", "pytest-xdist>=3.8.0", "ruff"]
# the frozen Mac and Linux apps alone: `uv sync --locked --no-dev --group app`. pywebview and pystray
# repeat here without their win32 marker, so the PyPI metadata above stays as it is
app = [
    "pyinstaller==6.22.3",
    "pywebview>=6.2,<7 ; sys_platform != 'win32'",
    "pystray>=0.19.5,<0.20 ; sys_platform != 'win32'",
    "pyobjc-framework-Cocoa ; sys_platform == 'darwin'",
    "pyobjc-framework-Vision ; sys_platform == 'darwin'",
    "pyobjc-framework-LocalAuthentication ; sys_platform == 'darwin'",
    "pyobjc-framework-UserNotifications ; sys_platform == 'darwin'",
    "pyobjc-framework-ServiceManagement ; sys_platform == 'darwin'",
    "faster-whisper==1.2.1",  # voice memos, bundled: a frozen app has no env to install into
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# PyPI cannot follow the README's repo-relative links and images: point them at GitHub
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\]\(|src="|srcset=")(?!https?://)'
replacement = '\1https://raw.githubusercontent.com/alenissacsam-2/keepfold/main/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)'
replacement = '](https://github.com/alenissacsam-2/keepfold/blob/main/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#'
replacement = '](https://github.com/alenissacsam-2/keepfold#'

[tool.hatch.build.targets.sdist]
# an allow-list: a build from a checkout with untracked or local-only files (docs/design, the
# full-history branch) must not ship them; this is what the wheel's build needs
only-include = ["src", "skills", "docs/GUIDE.md", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/keepfold"]

[tool.hatch.build.targets.wheel.force-include]
# the dashboard's Help tab and glossary; the repo files stay the one source (dashboard._help)
"skills/keepfold/modes/help.md" = "keepfold/assets/help/help.md"
"docs/GUIDE.md" = "keepfold/assets/help/GUIDE.md"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = ["slow: takes over ~10 s (deselect with -m 'not slow')",
           "perf: a timing benchmark; skipped under -n, run alone with -m perf"]
